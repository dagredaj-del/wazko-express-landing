<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Wazko Express">
  <defs>
    <linearGradient id="wk" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18e0a8"/>
      <stop offset="0.5" stop-color="#2d7bff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="wk-arrow" x1="60" y1="90" x2="110" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
  </defs>

  <!-- Ala / plumas (lado izquierdo) -->
  <g fill="url(#wk)">
    <path d="M10 44 C28 40 44 44 56 58 C44 54 30 54 16 58 Z"/>
    <path d="M8 58 C30 52 50 56 64 72 C48 66 30 66 14 72 Z"/>
    <path d="M12 72 C32 68 50 72 62 84 C46 80 30 80 18 86 Z"/>
  </g>

  <!-- Cuerpo: trazo tipo "W" ascendente -->
  <path d="M30 40 L46 86 L60 54 L74 86 L90 40"
        fill="none" stroke="url(#wk)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flecha ascendente (crecimiento) -->
  <g stroke="url(#wk-arrow)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 72 L102 34"/>
    <path d="M84 32 L104 32 L104 52"/>
  </g>

  <!-- Nodos tech -->
  <g fill="#2d7bff">
    <circle cx="20" cy="30" r="2.4"/>
    <circle cx="34" cy="24" r="2"/>
    <circle cx="100" cy="64" r="2.4"/>
  </g>
</svg>
